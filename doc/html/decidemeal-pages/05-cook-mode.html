<!doctype html>
<html lang='zh-CN'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <title>05 附近觅食</title>
  <link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0'>
  <link rel='stylesheet' href='./assets/app.css'>
  <style>
    .nearby-main { background:#fff; padding:10px 14px 16px; display:flex; flex-direction:column; gap:10px; }
    .nearby-head h2 { margin:0; font-size:30px; line-height:1.15; color:#1f2633; }
    .nearby-head p { margin:8px 0 0; font-size:13px; color:#6e7788; }

    .search {
      border:1px solid #e9edf4;
      border-radius:14px;
      height:44px;
      display:flex;
      align-items:center;
      gap:8px;
      padding:0 12px;
      color:#7c8596;
      background:#f8fafd;
      font-size:14px;
    }

    .chip-row {
      display:flex;
      gap:8px;
      overflow:auto;
      padding:2px 1px 4px;
      scrollbar-width:none;
    }
    .chip-row::-webkit-scrollbar { display:none; }
    .chip {
      border:1px solid #e8edf4;
      background:#f7f9fc;
      color:#5f697a;
      border-radius:999px;
      padding:8px 12px;
      font-size:12px;
      font-weight:700;
      white-space:nowrap;
      cursor:pointer;
    }
    .chip.active {
      border-color:#ffd79f;
      background:#fff2e0;
      color:#d86a00;
      box-shadow:0 8px 14px rgba(255,133,62,.16);
    }

    .list {
      display:flex;
      flex-direction:column;
      gap:10px;
      margin:0;
      padding:0;
      list-style:none;
    }

    .shop-card {
      border:1px solid #edf1f6;
      border-radius:18px;
      background:#fff;
      padding:10px;
      box-shadow:0 10px 22px rgba(30,41,65,.08);
      display:grid;
      grid-template-columns:74px 1fr auto;
      gap:10px;
      align-items:center;
    }

    .thumb {
      width:74px;
      height:74px;
      border-radius:14px;
      position:relative;
      overflow:hidden;
      background:linear-gradient(145deg,#ffd58f,#ff9c6a);
      box-shadow:0 8px 20px rgba(35,45,70,.16);
      border:1px solid rgba(255,255,255,.6);
    }
    .thumb::before {
      content:"";
      position:absolute;
      width:64px;
      height:64px;
      border-radius:50%;
      left:-16px;
      top:-16px;
      background:rgba(255,255,255,.2);
    }
    .thumb::after {
      content:"";
      position:absolute;
      width:52px;
      height:52px;
      border-radius:50%;
      right:-14px;
      bottom:-14px;
      background:rgba(255,255,255,.18);
    }
    .thumb.drink { background:linear-gradient(145deg,#94e3cb,#39b59a); }
    .thumb.fast { background:linear-gradient(145deg,#ffc8ca,#ff8f99); }

    .icon-wrap {
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%, -50%);
      width:40px;
      height:40px;
      border-radius:13px;
      background:rgba(255,255,255,.94);
      display:grid;
      place-items:center;
      color:#3a4252;
      z-index:1;
    }

    .shop-title {
      margin:0;
      font-size:16px;
      color:#1f2633;
      font-weight:800;
    }
    .shop-meta {
      margin-top:6px;
      font-size:12px;
      color:#707a8c;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .action {
      border:1px solid #ffd8b1;
      background:#fff1e3;
      color:#ff7a22;
      border-radius:12px;
      padding:8px 10px;
      font-size:12px;
      font-weight:700;
      white-space:nowrap;
      cursor:pointer;
    }

    .cta {
      margin-top:4px;
      width:100%;
      height:46px;
      border:0;
      border-radius:14px;
      font-size:16px;
      font-weight:800;
      color:#fff;
      background:linear-gradient(135deg,#ffb35c,#ff7f43);
      box-shadow:0 12px 18px rgba(255,120,58,.28);
      cursor:pointer;
    }
  </style>
</head>
<body><div class='wrap'><div class='phone'>
<header class='status'>
  <span class='status-time'>9:53</span>
  <span class='status-icons'>
    <i class='status-bar' aria-hidden='true'></i>
    <i class='status-wifi' aria-hidden='true'></i>
    <i class='status-battery' aria-hidden='true'></i>
  </span>
</header>

<main class='nearby-main'>
  <section class='nearby-head'>
    <h2>附近觅食</h2>
    <p>探店用：看看你周边现在吃什么更合适</p>
  </section>

  <div class='search'><span class='material-symbols-outlined'>search</span>搜索商圈、餐厅或菜系</div>

  <section class='chip-row' id='chips'>
    <button class='chip active' data-type='all' type='button'>全部</button>
    <button class='chip' data-type='hotpot' type='button'>火锅</button>
    <button class='chip' data-type='drink' type='button'>饮品</button>
    <button class='chip' data-type='fast' type='button'>快餐</button>
    <button class='chip' data-type='bbq' type='button'>烤肉</button>
  </section>

  <ul class='list' id='shopList'>
    <li class='shop-card' data-type='hotpot'>
      <div class='thumb'><span class='icon-wrap'><span class='material-symbols-outlined'>soup_kitchen</span></span></div>
      <div>
        <p class='shop-title'>海底捞（万象城店）</p>
        <p class='shop-meta'><span>火锅</span><span>1.1km</span><span>评分 4.8</span></p>
      </div>
      <button class='action' type='button'>想去</button>
    </li>

    <li class='shop-card' data-type='drink'>
      <div class='thumb drink'><span class='icon-wrap'><span class='material-symbols-outlined'>local_cafe</span></span></div>
      <div>
        <p class='shop-title'>喜茶（万象城店）</p>
        <p class='shop-meta'><span>饮品</span><span>1.5km</span><span>评分 4.6</span></p>
      </div>
      <button class='action' type='button'>想去</button>
    </li>

    <li class='shop-card' data-type='fast'>
      <div class='thumb fast'><span class='icon-wrap'><span class='material-symbols-outlined'>lunch_dining</span></span></div>
      <div>
        <p class='shop-title'>麦当劳（万象城店）</p>
        <p class='shop-meta'><span>快餐</span><span>1.8km</span><span>评分 4.5</span></p>
      </div>
      <button class='action' type='button'>想去</button>
    </li>
  </ul>

  <button class='btn btn-agent btn-block' id='aiNearbyBtn' type='button' style='margin-top:4px;height:42px;border-radius:14px;font-size:14px;font-weight:800;cursor:pointer'>
    <span class='material-symbols-outlined'>auto_awesome</span>AI 帮我挑一家
  </button>
  <button class='cta' id='voteBtn' type='button'>用这些店发起投票</button>
</main>

<footer class='footer-nav'>
  <a class='active' href='./02-home.html'><span class='material-symbols-outlined'>home</span><span>首页</span><i class='footer-dot'></i></a>
  <a href='./08-record.html'><span class='material-symbols-outlined'>history</span><span>记录</span><i class='footer-dot'></i></a>
  <a href='./09-mine.html'><span class='material-symbols-outlined'>person</span><span>我的</span><i class='footer-dot'></i></a>
</footer>
</div></div>

<script src='./assets/agent.js'></script>
<script>
(function(){
  var chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));
  var cards = Array.prototype.slice.call(document.querySelectorAll('.shop-card'));
  var voteBtn = document.getElementById('voteBtn');
  var aiBtn = document.getElementById('aiNearbyBtn');
  var phone = document.querySelector('.phone');

  chips.forEach(function(chip){
    chip.addEventListener('click', function(){
      var type = chip.getAttribute('data-type');
      chips.forEach(function(c){ c.classList.toggle('active', c === chip); });
      cards.forEach(function(card){
        var show = type === 'all' || card.getAttribute('data-type') === type;
        card.style.display = show ? 'grid' : 'none';
      });
    });
  });

  voteBtn.addEventListener('click', function(){
    voteBtn.textContent = '正在创建投票...';
    setTimeout(function(){ location.href = './04-vote.html'; }, 400);
  });

  aiBtn.addEventListener('click', async function(){
    var visible = cards.filter(function(c){ return c.style.display !== 'none'; });
    var names = visible.map(function(c){
      var t = c.querySelector('.shop-title');
      return t ? t.textContent : '';
    }).filter(Boolean);
    SoulFoodAgent.setLoading(aiBtn, true);
    try {
      var res = await SoulFoodAgent.randomPick(names);
      SoulFoodAgent.showToast(phone, 'AI 推荐：' + res.name + ' — ' + (res.reason || ''));
    } finally {
      SoulFoodAgent.setLoading(aiBtn, false);
      aiBtn.innerHTML = '<span class="material-symbols-outlined">auto_awesome</span>AI 帮我挑一家';
    }
  });
})();
</script>
</body></html>
