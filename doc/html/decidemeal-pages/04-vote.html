<!doctype html>
<html lang='zh-CN'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <title>04 房间投票页</title>
  <link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0'>
  <link rel='stylesheet' href='./assets/app.css'>
</head>
<body><div class='wrap'><p class='title'>04 房间投票页（Agent）</p><div class='phone'>
<header class='status'>
  <span class='status-time'>9:53</span>
  <span class='status-icons'>
    <i class='status-bar' aria-hidden='true'></i>
    <i class='status-wifi' aria-hidden='true'></i>
    <i class='status-battery' aria-hidden='true'></i>
  </span>
</header>
<main>
  <h2 class='h2' id='roomTitle'>火锅还是烤肉？</h2>
  <p class='sub'>房间号：123456　　4人参与</p>

  <section class='option-card mt12' data-option='火锅'>
    <div class='option-head'>
      <div class='option-left'>
        <span class='food-thumb thumb-hotpot'><span class='material-symbols-outlined'>soup_kitchen</span></span>
        <div>
          <div class='option-main'>火锅</div>
          <div class='vote-meta'>3票</div>
        </div>
      </div>
      <strong>75%</strong>
    </div>
    <div class='progress mt8'><div class='bar' style='width:75%'></div></div>
  </section>

  <section class='option-card mt10' data-option='烤肉'>
    <div class='option-head'>
      <div class='option-left'>
        <span class='food-thumb thumb-bbq'><span class='material-symbols-outlined'>outdoor_grill</span></span>
        <div>
          <div class='option-main'>烤肉</div>
          <div class='vote-meta'>1票</div>
        </div>
      </div>
      <strong>25%</strong>
    </div>
    <div class='progress mt8'><div class='bar' style='width:25%;background:#f3a247'></div></div>
  </section>

  <div id='aiOptions'></div>

  <button class='btn btn-secondary btn-agent btn-block mt10' id='aiSuggestBtn' type='button'>
    <span class='material-symbols-outlined'>auto_awesome</span>AI 补选项
  </button>
  <button class='btn btn-primary btn-block mt12' id='genRecipeBtn' type='button'>生成菜谱（Agent）</button>
</main>
<footer class='footer-nav'>
  <a class='active' href='./02-home.html'><span class='material-symbols-outlined'>home</span><span>首页</span><i class='footer-dot'></i></a>
  <a href='./08-record.html'><span class='material-symbols-outlined'>history</span><span>记录</span><i class='footer-dot'></i></a>
  <a href='./09-mine.html'><span class='material-symbols-outlined'>person</span><span>我的</span><i class='footer-dot'></i></a>
</footer>
</div></div>
<script src='./assets/agent.js'></script>
<script>
(function () {
  var phone = document.querySelector('.phone');
  var aiBtn = document.getElementById('aiSuggestBtn');
  var genBtn = document.getElementById('genRecipeBtn');
  var aiWrap = document.getElementById('aiOptions');
  var topic = sessionStorage.getItem('room_topic') || '今晚吃什么';

  aiBtn.addEventListener('click', async function () {
    SoulFoodAgent.setLoading(aiBtn, true);
    try {
      var res = await SoulFoodAgent.suggestVoteOptions(topic);
      aiWrap.innerHTML = res.options.map(function (name) {
        return '<section class="option-card mt10" data-option="' + name + '">' +
          '<div class="option-head"><div class="option-left">' +
          '<span class="food-thumb thumb-noodle"><span class="material-symbols-outlined">restaurant</span></span>' +
          '<div><div class="option-main">' + name + '</div><div class="vote-meta">AI 建议 · 0票</div></div></div>' +
          '<strong>—</strong></div></section>';
      }).join('');
      SoulFoodAgent.showToast(phone, '已添加 ' + res.options.length + ' 个 AI 选项');
    } finally {
      SoulFoodAgent.setLoading(aiBtn, false);
      aiBtn.innerHTML = '<span class="material-symbols-outlined">auto_awesome</span>AI 补选项';
    }
  });

  genBtn.addEventListener('click', function () {
    SoulFoodAgent.setVoteContext({
      winner: '火锅',
      roomCode: '123456',
      participants: 4,
      options: ['火锅', '烤肉']
    });
    SoulFoodAgent.setLoading(genBtn, true, '生成菜谱...');
    setTimeout(function () { location.href = './06-result.html'; }, 400);
  });
})();
</script>
</body></html>
