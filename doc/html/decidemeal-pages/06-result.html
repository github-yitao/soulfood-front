<!doctype html>
<html lang='zh-CN'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <title>06 菜谱结果页</title>
  <link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0'>
  <link rel='stylesheet' href='./assets/app.css'>
</head>
<body><div class='wrap'><p class='title'>06 菜谱结果页（Agent）</p><div class='phone'>
<header class='status'>
  <span class='status-time'>9:53</span>
  <span class='status-icons'>
    <i class='status-bar' aria-hidden='true'></i>
    <i class='status-wifi' aria-hidden='true'></i>
    <i class='status-battery' aria-hidden='true'></i>
  </span>
</header>
<main>
  <div class='agent-row'>
    <div>
      <span class='agent-badge'><span class='material-symbols-outlined'>auto_awesome</span>AI 推荐</span>
      <h2 class='h2' style='margin:0'>推荐菜谱</h2>
      <p class='sub' id='resultSub'>根据投票结果与你的口味偏好生成</p>
    </div>
  </div>
  <ul class='list mt10' id='recipeList'>
    <li><span class='option-left'>加载中...</span><span>—</span></li>
  </ul>
  <p class='agent-source' id='agentSource'></p>
  <div class='row mt16'>
    <button class='btn btn-secondary' id='refreshBtn' type='button'>换一批</button>
    <a class='btn btn-primary' href='./12-favorites.html'>收藏菜谱</a>
  </div>
</main>
<footer class='footer-nav'>
  <a class='active' href='./02-home.html'><span class='material-symbols-outlined'>home</span><span>首页</span><i class='footer-dot'></i></a>
  <a href='./08-record.html'><span class='material-symbols-outlined'>history</span><span>记录</span><i class='footer-dot'></i></a>
  <a href='./09-mine.html'><span class='material-symbols-outlined'>person</span><span>我的</span><i class='footer-dot'></i></a>
</footer>
</div></div>
<script src='./assets/agent.js'></script>
<script>
(function () {
  var list = document.getElementById('recipeList');
  var sub = document.getElementById('resultSub');
  var sourceEl = document.getElementById('agentSource');
  var refreshBtn = document.getElementById('refreshBtn');
  var ctx = SoulFoodAgent.getVoteContext();
  if (ctx && ctx.winner) {
    sub.textContent = '投票胜出：' + ctx.winner + ' · 已结合你的口味偏好';
  }

  async function load() {
    SoulFoodAgent.setLoading(refreshBtn, true, '生成中...');
    try {
      var res = await SoulFoodAgent.recommendRecipes();
      SoulFoodAgent.renderRecipeList(list, res.items);
      sourceEl.textContent = res.source.indexOf('mock') >= 0
        ? '演示：未连接后端时使用本地 Mock（可设置 SoulFoodAgent.setBaseUrl）'
        : '来源：' + res.source + ' · GET /ai/recommend';
      if (res.source.indexOf('fallback') >= 0) {
        SoulFoodAgent.showToast(document.querySelector('.phone'), '后端未响应，已使用本地推荐', 'error');
      }
    } finally {
      SoulFoodAgent.setLoading(refreshBtn, false);
      refreshBtn.textContent = '换一批';
    }
  }

  refreshBtn.addEventListener('click', load);
  load();
})();
</script>
</body></html>
